; Minimal php.ini for the bundled BMC portable runtime (Windows).
; extension_dir is relative to this php.ini's own folder.
extension_dir = "ext"

; Without this, PHP's default "EGPCS" populates $_ENV with Windows env var
; keys in their OS-native mixed case (Path, SystemRoot, windir, ComSpec...).
; `php artisan serve` filters the child process's environment case-sensitively,
; so those Windows-critical variables get dropped/mangled in the spawned
; child - breaking its ability to open a listening socket at all, regardless
; of port or bind address. See laravel/framework#34886.
variables_order = "GPCS"

extension=curl
extension=fileinfo
extension=mbstring
extension=openssl
extension=pdo_sqlite
extension=sqlite3

memory_limit = 256M
max_execution_time = 0
date.timezone = "Asia/Kuala_Lumpur"

; Laravel writes generated files under storage/ and bootstrap/cache/ next to this runtime.
upload_max_filesize = 20M
post_max_size = 20M
