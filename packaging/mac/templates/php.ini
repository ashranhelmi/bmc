; php.ini for the bundled BMC static PHP binary (macOS).
; All extensions are compiled statically into the binary itself (static-php-cli)
; - no extension_dir / extension= directives needed here, unlike the Windows
; portable build where extensions load as separate DLLs.

memory_limit = 256M
max_execution_time = 0
date.timezone = "Asia/Kuala_Lumpur"

; auto_prepend_file (the mb_split polyfill) is passed as an absolute -d flag
; from the launcher script at run time, not set here - a relative path here
; would resolve against Laravel's own cwd, not this ini file's location
; (same lesson as the Windows build's extension_dir bug).

upload_max_filesize = 20M
post_max_size = 20M
